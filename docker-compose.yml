services:
  postgres:
    image: postgres:16-alpine
    container_name: turnero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appointments
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d appointments"]
      interval: 2s
      timeout: 5s
      retries: 5
